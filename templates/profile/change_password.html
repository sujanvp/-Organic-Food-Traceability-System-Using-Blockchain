{% extends 'base.html' %}

{% block title %}Change Password - OrganicTrace{% endblock %}

{% block extra_css %}
<style>
    .password-card {
        max-width: 500px;
        margin: 40px auto;
        padding: 40px;
    }

    .form-floating>label {
        padding-left: 20px;
    }

    .form-control {
        border-radius: 15px;
        padding: 1.1rem 1.25rem;
        border: 2px solid #f0f0f0;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.25rem rgba(46, 204, 113, 0.1);
    }

    .input-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #ddd;
        z-index: 10;
    }
</style>
{% endblock %}

{% block content %}
<div class="glass-card password-card" data-aos="fade-up">
    <div class="text-center mb-5">
        <div class="bg-primary-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
            style="width: 80px; height: 80px;">
            <i class="bi bi-shield-lock-fill fs-1"></i>
        </div>
        <h2 class="fw-bold">Security</h2>
        <p class="text-muted">Update your account credentials.</p>
    </div>

    {% if error %}
    <div class="alert alert-danger border-0 rounded-4 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST" id="passwordForm">
        <div class="mb-4 position-relative">
            <div class="form-floating">
                <input type="password" class="form-control" id="current_password" name="current_password"
                    placeholder="Current Password" required>
                <label for="current_password">Current Password</label>
            </div>
            <i class="bi bi-key input-icon"></i>
        </div>

        <div class="mb-4 position-relative">
            <div class="form-floating">
                <input type="password" class="form-control" id="new_password" name="new_password"
                    placeholder="New Password" required>
                <label for="new_password">New Password</label>
            </div>
            <i class="bi bi-lock input-icon"></i>
        </div>

        <div class="mb-5 position-relative">
            <div class="form-floating">
                <input type="password" class="form-control" id="confirm_password" name="confirm_password"
                    placeholder="Confirm Password" required>
                <label for="confirm_password">Confirm New Password</label>
            </div>
            <i class="bi bi-lock-fill input-icon"></i>
        </div>

        <div class="d-grid gap-3">
            <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold shadow-sm">
                Update Security <i class="bi bi-shield-check ms-2"></i>
            </button>
            <a href="/profile" class="btn btn-light border rounded-pill py-3 fw-bold">
                Back to Profile
            </a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.getElementById('passwordForm').addEventListener('submit', function (e) {
        const newPass = document.getElementById('new_password').value;
        const confirmPass = document.getElementById('confirm_password').value;

        if (newPass !== confirmPass) {
            e.preventDefault();
            alert('New passwords do not match!');
            return false;
        }

        if (newPass.length < 6) {
            e.preventDefault();
            alert('Password must be at least 6 characters long');
            return false;
        }
    });
</script>
{% endblock %}
