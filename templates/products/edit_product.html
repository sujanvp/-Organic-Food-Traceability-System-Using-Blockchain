{% extends 'base.html' %}

{% block title %}Edit Product - OrganicTrace{% endblock %}

{% block extra_css %}
<style>
    .form-hero {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        padding: 50px 30px;
        border-radius: 20px;
        margin-bottom: -50px;
        position: relative;
        z-index: 1;
    }

    .form-card {
        max-width: 800px;
        margin: 0 auto 50px;
        padding: 80px 40px 40px;
        position: relative;
        z-index: 0;
    }

    .form-floating>label {
        padding-left: 20px;
    }

    .form-control {
        border-radius: 15px;
        border: 2px solid #f0f0f0;
        padding: 1.1rem 1.25rem;
        transition: all 0.3s;
    }

    .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 0.25rem rgba(46, 204, 113, 0.1);
    }

    .input-icon {
        position: absolute;
        right: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #ddd;
        z-index: 10;
    }
</style>
{% endblock %}

{% block content %}
<div class="container" data-aos="fade-up">
    <div class="form-hero glass-card text-center">
        <h1 class="fw-bold mb-2">Update <span class="text-white">Product Specs</span></h1>
        <p class="mb-0 opacity-75">Modify the metadata for Batch #{{ product[0]|string|zfill(5) }}</p>
    </div>

    <div class="glass-card form-card shadow-lg">
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6">
                    <div class="form-floating position-relative">
                        <input type="text" class="form-control" id="product_name" name="product_name"
                            value="{{ product[1] }}" placeholder="Name" required>
                        <label for="product_name">Product Name *</label>
                        <i class="bi bi-box-seam input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating position-relative">
                        <select class="form-select" id="product_type" name="product_type" required>
                            <option value="vegetable" {% if product[2]=='vegetable' %}selected{% endif %}>Vegetable
                            </option>
                            <option value="fruit" {% if product[2]=='fruit' %}selected{% endif %}>Fruit</option>
                            <option value="grain" {% if product[2]=='grain' %}selected{% endif %}>Grain</option>
                            <option value="dairy" {% if product[2]=='dairy' %}selected{% endif %}>Dairy</option>
                            <option value="processed" {% if product[2]=='processed' %}selected{% endif %}>Processed
                            </option>
                        </select>
                        <label for="product_type">Product Type *</label>
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="form-floating position-relative">
                        <select class="form-select" id="status" name="status" required>
                            <option value="Active" {% if product[5]=='Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if product[5]=='Inactive' %}selected{% endif %}>Inactive
                            </option>
                            <option value="Processing" {% if product[5]=='Processing' %}selected{% endif %}>Processing
                            </option>
                        </select>
                        <label for="status">Current Status *</label>
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="form-floating position-relative">
                        <input type="text" class="form-control" id="certification_no" name="certification_no"
                            value="{{ product[6] if product[6] else '' }}" placeholder="Cert No">
                        <label for="certification_no">Organic Certification Number</label>
                        <i class="bi bi-patch-check-fill input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating position-relative">
                        <input type="number" class="form-control" id="quantity" name="quantity"
                            value="{{ product[7] if product[7] else '' }}" placeholder="Qty" step="0.01">
                        <label for="quantity">Quantity</label>
                        <i class="bi bi-hash input-icon"></i>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-floating position-relative">
                        <input type="text" class="form-control" id="unit" name="unit"
                            value="{{ product[8] if product[8] else '' }}" placeholder="Unit">
                        <label for="unit">Unit (e.g., KG, LBS)</label>
                        <i class="bi bi-rulers input-icon"></i>
                    </div>
                </div>

                <div class="col-12 mt-5">
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-primary rounded-pill py-3 fw-bold shadow-sm">
                            <i class="bi bi-cloud-upload me-2"></i> Update Blockchain Records
                        </button>
                        <a href="/products" class="btn btn-light border rounded-pill py-3 fw-bold">
                            Cancel and Return
                        </a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
